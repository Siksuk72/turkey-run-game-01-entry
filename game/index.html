<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Giblet's Great Escape — 3 farms · 9 ovens · 24 knives · 1 farmer</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #241a26; }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  #game { width: min(100vw, 177.78vh); height: min(100vh, 56.25vw); display: block; touch-action: none; cursor: pointer; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  #selftest-out { position: absolute; width: 1px; height: 1px; overflow: hidden; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="1280" height="720" aria-label="Giblet's Great Escape: a turkey runs 900 metres from the farmyard through the barn and the kitchen, chased by Farmer Bram, jumping fences and ovens and ducking carving knives"></canvas>
</div>
<p id="status" role="status" aria-live="polite"></p>
<pre id="selftest-out"></pre>
<script type="module" src="./src/main.js"></script>
</body>
</html>
